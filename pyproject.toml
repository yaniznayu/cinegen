[project]
name = "cinegen"
version = "0.0.1"
description = "Autonomous Unreal Engine cinematic + playable world generator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["typer>=0.12", "pydantic>=2", "pyyaml>=6", "python-dotenv>=1", "rich>=13"]

[project.scripts]
cinegen = "cinegen.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cinegen"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
