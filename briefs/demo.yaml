title: The Last Knight
style: dark fantasy, desaturated, volumetric fog, anamorphic
world:
  biome: ruined_city
  time_of_day: dusk
  weather: fog
characters:
  - name: Knight
    prompt: a lone armored knight, weathered plate armor, torn cape, longsword, realistic
    animations: [idle, walk]
shots:
